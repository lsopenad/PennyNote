name: PennyNote
options:
  bundleIdPrefix: com.pennynote
  # La interfaz solo está en español: sin esto la app declara inglés y las fechas que formatea el
  # sistema (cabeceras de día, «hace 8 segundos») salen en inglés aunque el iPhone esté en español.
  developmentLanguage: es
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Comunes a los tres targets. scripts/release.sh actualiza aquí MARKETING_VERSION y CURRENT_PROJECT_VERSION.
# TARGETED_DEVICE_FAMILY va en cada target: XcodeGen pone "1,2" por defecto a nivel de target y taparía este.
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "3875E33454"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"

targets:
  PennyNote:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PennyNote
    info:
      path: Generated/PennyNote-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pennynote
            CFBundleURLName: com.pennynote.app
        # Vienen de Config/Supabase.xcconfig (ver Config/App.xcconfig); vacíos si no existe.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    entitlements:
      path: Generated/PennyNote.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pennynote.app
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennynote.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PennyNoteWidgetExtension
        embed: true
      - package: Supabase

  PennyNoteWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PennyNoteWidget
      - path: PennyNote/AppGroup
      - path: PennyNote/Logging.swift
      - path: PennyNote/Intents/OpenAddExpenseIntent.swift
      # Solo por AccentColor: así las gráficas del widget usan el mismo verde que la app.
      - path: PennyNote/Resources/Assets.xcassets
    info:
      path: Generated/PennyNoteWidgetExtension-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/PennyNoteWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pennynote.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennynote.app.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"

  PennyNoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PennyNoteTests
    dependencies:
      - target: PennyNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennynote.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PennyNote:
    build:
      targets:
        PennyNote: all
        PennyNoteWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PennyNoteTests
    archive:
      config: Release
