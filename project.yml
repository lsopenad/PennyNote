name: PennyNote
options:
  bundleIdPrefix: com.pennynote
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

targets:
  PennyNote:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PennyNote
    info:
      path: Generated/PennyNote-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pennynote
            CFBundleURLName: com.pennynote.app
    entitlements:
      path: Generated/PennyNote.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pennynote.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennynote.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3875E33454"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PennyNoteWidgetExtension
        embed: true

  PennyNoteWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PennyNoteWidget
      - path: PennyNote/AppGroup
      - path: PennyNote/Intents/OpenAddExpenseIntent.swift
    info:
      path: Generated/PennyNoteWidgetExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/PennyNoteWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pennynote.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennynote.app.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3875E33454"
        SKIP_INSTALL: "YES"

  PennyNoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PennyNoteTests
    dependencies:
      - target: PennyNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennynote.app.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3875E33454"

schemes:
  PennyNote:
    build:
      targets:
        PennyNote: all
        PennyNoteWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PennyNoteTests
    archive:
      config: Release
